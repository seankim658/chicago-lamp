[project]
name = "lamp-collector"
version = "0.0.0"
description = "Collector that polls CTA feeds and keeps every raw response"
requires-python = ">=3.12"
dependencies = [
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "lamp-storage",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
]

[tool.uv.sources]
lamp-storage = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
