# The workspace root is not a package. Each stage and shared module is a package
# under packages/<layer>/<name>, and the check script runs with --all-packages.

# uv and the uv_build backend of every package are pinned to the same minor
# version. Raise them together, on purpose, after reading uv's changelog.
[tool.uv]
required-version = ">=0.13,<0.14"

[tool.uv.workspace]
members = ["packages/*/*"]

[dependency-groups]
dev = [
    "deptry>=0.25",
    "import-linter>=2.17",
    "moto>=5.2.5",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-xdist>=3.8",
    "ruff>=0.17",
    "types-boto3[s3]>=1.44.9",
]

# Architecture layers, lowest first. A package's layer is the folder it sits in.
# A layer may import only the layers below it, and packages in the same layer
# never import each other.
[tool.chicago-lamp]
layers = ["shared", "stages"]

# Licenses a shipped dependency may carry. Dev tools never ship, so they are not
# checked. A package whose metadata names no SPDX expression gets a reviewed entry
# for its exact version, read from the license file it ships.
[tool.chicago-lamp.licenses]
allowed = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "PSF-2.0",
]

[[tool.chicago-lamp.licenses.reviewed]]
package = "python-dateutil"
version = "2.9.0.post0"
license = "Apache-2.0 AND BSD-3-Clause"
reason = "Metadata says Dual License. Its LICENSE puts all code under BSD-3-Clause and code since 2017-12-01 under Apache-2.0 too."

[[tool.chicago-lamp.licenses.reviewed]]
package = "s3transfer"
version = "0.19.3"
license = "Apache-2.0"
reason = "Metadata says Apache License 2.0, which is not an SPDX ID. Its LICENSE.txt is the Apache License 2.0 text."

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "S",
    "SIM", "PT", "PTH", "T20", "ERA", "RUF",
]

[tool.ruff.lint.per-file-ignores]
# pytest reports through assert.
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# scripts/check.sh names the paths and checks each package in its own run.
mypy_path = "scripts/checks:scripts"

[tool.pytest]
testpaths = ["packages", "scripts", "tests"]
pythonpath = ["scripts/checks", "scripts"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
